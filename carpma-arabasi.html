<!-- Ortak rekor tablosu (dosya yoksa ya da kurulmadıysa oyun yine çalışır) -->
<script src="https://agahakbatur.github.io/ogreticiler/libs/skor-sistemi.js"></script>
<script>
/* =====================================================================
   ÇARPMA ARABASI – MATEMATİK YARIŞI
   SORU MOTORU (oyundan bağımsız; tek başına test edilebilir)
   Kurallar:
   - Soru türü: 5 içinde (2. çarpan en fazla 5) / 10 içinde (2. çarpan en fazla 10)
   - İlk çarpan: kolay 1–5, orta 2–6, zor 3–7 ile başlar; her 10 doğruda üst sınır +1 (en fazla 10)
   - 0 ile çarpma hiç gelmez, 1 ile çarpma daha seyrek gelir
   - 3 seçenek: 1 doğru + 2 mantıklı yanlış; doğru cevabın şeridi ve büyüklük sırası dengeli dağılır
   ===================================================================== */
const MulEngine = (() => {
  const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
  const shuffle = arr => { const r = [...arr]; for (let i = r.length - 1; i > 0; i--) { const j = rnd(0, i); [r[i], r[j]] = [r[j], r[i]]; } return r; };
  const LO = { kolay: 1, orta: 2, zor: 3 }, HI = { kolay: 5, orta: 6, zor: 7 };
  let recent = [], laneBag = [], rankBag = [], laneHist = [];

  function firstRange(diff, correct) { return [LO[diff], Math.min(10, HI[diff] + Math.floor(correct / 10))]; }
  function pickWeighted(lo, hi) {           // 1 seyrek gelsin
    const items = []; for (let v = lo; v <= hi; v++) items.push([v, v === 1 ? 0.25 : 1]);
    let r = Math.random() * items.reduce((s, x) => s + x[1], 0);
    for (const [v, w] of items) { if ((r -= w) < 0) return v; } return hi;
  }
  function fromBag(bagName) {
    if (bagName === 'lane') { if (!laneBag.length) laneBag = shuffle([0, 1, 2]); return laneBag.pop(); }
    if (!rankBag.length) rankBag = shuffle([0, 1, 2]); return rankBag.pop();
  }
  function nextLane() {
    let l = fromBag('lane');
    if (laneHist.length >= 2 && laneHist[laneHist.length - 1] === l && laneHist[laneHist.length - 2] === l) { laneBag.unshift(l); l = (l + 1 + rnd(0, 1)) % 3; }
    laneHist.push(l); if (laneHist.length > 4) laneHist.shift();
    return l;
  }

  // Yanlış seçenekler: önce çarpım tablosundaki komşular (bir eksik/fazla grup), sonra ±1/±2, sonra ±10
  function distractors(a, b, c, rank) {
    const ok = v => Number.isInteger(v) && v > 0 && v !== c;
    const table = shuffle([(a - 1) * b, (a + 1) * b, a * (b - 1), a * (b + 1)].filter(ok));
    const near = shuffle([c - 1, c + 1, c - 2, c + 2].filter(ok));
    const far = shuffle([c - 10, c + 10].filter(ok));
    const all = [...new Set([...table, ...near, ...far])];
    const low = all.filter(v => v < c), high = all.filter(v => v > c);
    const feas = [high.length >= 2, low.length >= 1 && high.length >= 1, low.length >= 2];
    if (!feas[rank]) rank = [1, 0, 2].find(r => feas[r]);
    if (rank === 0) return high.slice(0, 2);
    if (rank === 2) return low.slice(0, 2);
    return [low[0], high[0]];
  }

  function make(type, diff, correctSoFar) {
    const [lo, hi] = firstRange(diff, correctSoFar);
    let a, b, t = 0;
    do { a = pickWeighted(lo, hi); b = pickWeighted(1, type); t++; } while (recent.includes(a + 'x' + b) && t < 40);
    recent.push(a + 'x' + b); if (recent.length > 8) recent.shift();
    const c = a * b, lane = nextLane(), wrong = shuffle(distractors(a, b, c, fromBag('rank')));
    const answers = []; answers[lane] = c;
    [0, 1, 2].filter(k => k !== lane).forEach((k, i) => answers[k] = wrong[i]);
    return { a, b, c, answers, lane };
  }
  function reset() { recent = []; laneBag = []; rankBag = []; laneHist = []; }
  return { make, reset, firstRange };
})();
/* ======================= SORU MOTORU SONU ======================= */

(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('cv');
let ctx = cv.getContext('2d');   // önizleme çizimleri için geçici olarak başka tuvale yönlendirilebilir
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const rf = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

/* ---------------- Ayarlar ---------------- */
const cfg = { type: 5, diff: 'kolay', speed: 100, car: 0, track: 0, sound: true, engine: 1, obst: 0, obstLv: 1 };   // engine: sürekli motor sesi (1 açık / 0 kapalı)   // obst: 0 kapalı / 1 açık; obstLv: engel zorluğu 1–3
const TARGET = 50, MAXLIVES = 5, POINTS = 10;

/* ---------------- Araçlar ---------------- */
const CARS = [
  { ad: 'Kırmızı Şimşek', body: '#e5383b', dark: '#9b1c1f', helm: '#ffffff', acc: '#ffc83d', wing: 'wide', no: 1 },
  { ad: 'Mavi Roket',     body: '#2d7ff9', dark: '#174a9c', helm: '#ffc83d', acc: '#ffffff', wing: 'twin', no: 7 },
  { ad: 'Sarı Arı',       body: '#ffc83d', dark: '#b07d00', helm: '#1f2433', acc: '#1f2433', wing: 'round', no: 3 }
];
const RIVALS = [
  { body: '#2fb35a', dark: '#1a6e37', helm: '#ffffff', acc: '#ffffff', wing: 'wide', no: 2 },
  { body: '#9b5de5', dark: '#5b2f96', helm: '#ffd6f5', acc: '#ffd6f5', wing: 'twin', no: 5 },
  { body: '#ff8a3d', dark: '#b4511a', helm: '#1f2433', acc: '#ffffff', wing: 'round', no: 9 }
];

/* ---------------- Pistler ---------------- */
const TRACKS = [
  { ad: 'Tropikal Ada', emoji: '🏝️', sky: ['#4fc3ff', '#c8f0ff'], g1: '#5cc46a', g2: '#51b660', road: '#6b6f7c', road2: '#666a77',
    kerbA: '#e5383b', kerbB: '#ffffff', line: '#ffffff', decor: ['palm', 'palm', 'bush', 'flower'], obst: ['cone', 'barrier', 'closure', 'rock'], bg: 'sea' },
  { ad: 'Çöl Vadisi', emoji: '🏜️', sky: ['#ffa95e', '#ffe4c0'], g1: '#e7c17d', g2: '#dcb46f', road: '#7c6a5b', road2: '#766455',
    kerbA: '#c0392b', kerbB: '#f6e7c8', line: '#fff3d6', decor: ['cactus', 'cactus', 'rockD', 'drybush'], obst: ['cone', 'barrel', 'closure', 'tumble'], bg: 'mesa' },
  { ad: 'Karlı Dağ', emoji: '🏔️', sky: ['#86b2dc', '#eaf4ff'], g1: '#f3f7fc', g2: '#e4ecf6', road: '#5c6570', road2: '#57606b',
    kerbA: '#2b6cb0', kerbB: '#ffffff', line: '#ffffff', decor: ['pine', 'pine', 'pineS', 'snowmanD'], obst: ['cone', 'closure', 'snowman', 'ice'], bg: 'mount', snow: true }
];

/* ---------------- Dünya ölçüleri ---------------- */
const ZN = 1.6, ZP = 3.3, ZFAR = 75, RW = 1.65, LANES = [-1.1, 0, 1.1], SEG = 2.5;
const BASE_V = 13;                 // %100 hızda saniyedeki birim
let W = 800, H = 500, dpr = 1, yH = 180, F = 300, K = 1, cx = 400, camX = 0;

function resize() {
  const r = cv.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(280, r.width); H = Math.max(220, r.height);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const portrait = H > W;
  yH = H * (portrait ? 0.33 : 0.36);
  F = ZN * (H - yH);
  const span = portrait ? W * 0.98 : Math.min(W * 0.8, H * 1.25);   // oyuncu hizasında yol genişliği
  K = span * ZP / (2 * RW * F);
  cx = W / 2;
  // Bilgi mesajları ("Doğru!", "TURBO!") yolu örtmesin: aracın altı ile ekranın altı arasına ortalanır
  $('toast').style.top = Math.round((yH + F / ZP + H) / 2) + 'px';
}
new ResizeObserver(resize).observe(cv);

// dz: kameradan uzaklık, x: yol ekseninden yan uzaklık (birim), h: yerden yükseklik (birim)
function P(x, dz, h = 0) { const s = F / dz; return { x: cx + (x - camX) * s * K, y: yH + s - h * s * K, u: s * K, g: yH + s }; }

/* ---------------- Ses ---------------- */
let actx = null;
function tone(f, t0, dur, type = 'triangle', vol = .15, f2) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + .015); g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
  o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + dur + .05);
}
function sfx(k) {
  if (!cfg.sound) return;
  try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) { return; }
  const t = actx.currentTime;
  if (k === 'ok') [660, 880, 1320].forEach((f, i) => tone(f, t + i * .07, .16));
  else if (k === 'no') { tone(300, t, .25, 'sawtooth', .07, 150); }
  else if (k === 'coin') { tone(1320, t, .07, 'square', .05); tone(1760, t + .06, .12, 'square', .05); }
  else if (k === 'heart') [523, 784, 1047].forEach((f, i) => tone(f, t + i * .08, .18, 'sine', .14));
  else if (k === 'crash') { tone(180, t, .35, 'sawtooth', .12, 60); tone(90, t, .4, 'square', .06, 40); }
  else if (k === 'boost') tone(220, t, .6, 'sawtooth', .07, 880);
  else if (k === 'beep') tone(660, t, .14, 'square', .06);
  else if (k === 'go') tone(990, t, .35, 'square', .07);
  else if (k === 'pass') [880, 1175].forEach((f, i) => tone(f, t + i * .06, .1, 'triangle', .08));
  else if (k === 'win') [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, t + i * .13, .26));
}

/* ---------------- Sürekli motor sesi (kısık; hıza göre incelir) ---------------- */
let eng = null, engT = 0;
function engineUpdate(dt) {
  engT += dt; if (engT < .1) return; engT = 0;            // saniyede 10 kez güncelle
  if (!actx) return;
  const on = cfg.sound && cfg.engine && (mode === 'race' || mode === 'count') && S;
  if (!eng) {
    if (!on) return;
    const o1 = actx.createOscillator(), o2 = actx.createOscillator(), lfo = actx.createOscillator();
    const lfoG = actx.createGain(), f = actx.createBiquadFilter(), g = actx.createGain();
    o1.type = 'sawtooth'; o2.type = 'square'; lfo.type = 'sine'; lfo.frequency.value = 11; lfoG.gain.value = 4;
    f.type = 'lowpass'; f.frequency.value = 300; f.Q.value = 1.5; g.gain.value = 0;
    lfo.connect(lfoG); lfoG.connect(o1.frequency); lfoG.connect(o2.frequency);
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(actx.destination);
    o1.start(); o2.start(); lfo.start();
    eng = { o1, o2, lfo, f, g };
  }
  const t = actx.currentTime;
  if (!on) { eng.g.gain.setTargetAtTime(0, t, .08); return; }
  const v = mode === 'race' ? curV() : 0;                 // geri sayımda rölanti
  const hz = 38 + v * 2.2;
  eng.o1.frequency.setTargetAtTime(hz, t, .2); eng.o2.frequency.setTargetAtTime(hz * .5, t, .2);
  eng.f.frequency.setTargetAtTime(220 + v * 12, t, .2);
  eng.g.gain.setTargetAtTime(.045, t, .15);                // kısık ses düzeyi
}

/* ---------------- Oyun durumu ---------------- */
let S = null;          // yarış durumu
let mode = 'menu';     // menu | count | race | pause | end
function newState() {
  const tr = TRACKS[cfg.track];
  const st = {
    tr, t: 0, dist: 0, lane: 1, px: 0, vBase: BASE_V * cfg.speed / 100, sf: 1, crashMul: 1, boost: 0, invuln: 0, shake: 0,
    lives: 3, score: 0, distAcc: 0, correct: 0, wrong: 0, coins: 0, passes: 0, crashes: 0,
    q: null, gate: null, objs: [], rivals: [], parts: [], snow: [], rivalF: 1, rivalT: 0, flash: null, lean: 0

  const pz = st.dist + ZP;

function curV() { return S.vBase * S.sf * S.crashMul * (1 + 0.45 * Math.min(1, S.boost)); }

/* ---------------- Nesne üretimi ---------------- */
const OB = { // w: genişlik (birim), lanes: kapladığı şerit sayısı
  cone: { w: .45 }, barrier: { w: .95 }, closure: { w: 2.1, two: true }, rock: { w: .8 },
  barrel: { w: .6 }, tumble: { w: .7 }, snowman: { w: .7 }, ice: { w: .9 }
};
function spawnBetween(z0, z1) {
  const placed = [];
  const room = z1 - z0;
  if (cfg.obst && room > 20) {
    // Engel zorluğu: 1 = az engel, 2 = biraz daha fazla, 3 = en çok + iki şeridi kapatan "YOL KAPALI"
    let n;
    if (cfg.obstLv === 1) n = Math.random() < .4 ? 1 : 0;
    else if (cfg.obstLv === 2) { n = Math.random() < .75 ? 1 : 0; if (room > 45 && Math.random() < .25) n++; }
    else n = room > 45 ? 2 : 1;
    const kinds = S.tr.obst.filter(k => cfg.obstLv === 3 || !OB[k].two);
    for (let k = 0; k < n; k++) {
      for (let tries = 0; tries < 10; tries++) {
        const z = rf(z0 + 6, z1 - 14);
        if (placed.some(p => Math.abs(p.z - z) < 9)) continue;
        const kind = kinds[rnd(0, kinds.length - 1)];
        let x, lanes;
        if (OB[kind].two) { const left = Math.random() < .5; x = left ? -0.55 : 0.55; lanes = left ? [0, 1] : [1, 2]; }
        else { const l = rnd(0, 2); x = LANES[l]; lanes = [l]; }
        const o = { type: 'ob', kind, x, z, lanes, w: OB[kind].w, hit: false };
        S.objs.push(o); placed.push(o); break;
      }
    }
  }
  // altın dizisi
  const cz = rf(z0 + 4, Math.max(z0 + 5, z1 - 12));
  const free = [0, 1, 2].filter(l => !placed.some(p => p.lanes.includes(l) && Math.abs(p.z - (cz + 3)) < 7));
  if (free.length) { const l = free[rnd(0, free.length - 1)]; for (let i = 0; i < 3; i++) S.objs.push({ type: 'coin', x: LANES[l], z: cz + i * 2.4, lanes: [l] }); }
  // kalp
  if (S.lives < MAXLIVES && Math.random() < 0.16) {
    const hz = rf(z0 + 5, Math.max(z0 + 6, z1 - 12));
    const fl = [0, 1, 2].filter(l => !S.objs.some(p => p.lanes && p.lanes.includes(l) && Math.abs(p.z - hz) < 5));
    if (fl.length) { const l = fl[rnd(0, fl.length - 1)]; S.objs.push({ type: 'heart', x: LANES[l], z: hz, lanes: [l] }); }
  }
}
function nextQuestion(first) {
  S.q = MulEngine.make(cfg.type, cfg.diff, S.correct);
  const v = curV();
  const ahead = Math.max(first ? 60 : 48, v * (first ? 6 : 5.2));  // okumaya yeterli süre kalsın
  const gz = S.dist + ZP + ahead;
  const from = S.gate ? S.gate.z + 2 : S.dist + ZP + 8;
  S.gate = { z: gz, answers: S.q.answers, lane: S.q.lane, done: false };
  spawnBetween(from, gz);
  $('qtext').textContent = `${S.q.a} × ${S.q.b} = ?`; $('qtext').className = '';
  [...$('chips').children].forEach((c, i) => c.textContent = S.q.answers[i]);
}

/* ---------------- HUD ---------------- */
function hud() {
  $('lives').textContent = '❤'.repeat(S.lives) + '♡'.repeat(Math.max(0, 3 - S.lives));
  $('sCorrect').textContent = S.correct + '/' + TARGET;
  $('sScore').textContent = S.score;
  $('sSpeed').textContent = '%' + Math.round(cfg.speed * S.sf);
  $('sPos').textContent = position() + '/4';
  $('barFill').style.width = (100 * S.correct / TARGET) + '%';
}
function position() { const pz = S.dist + ZP; return 1 + S.rivals.filter(r => r.z > pz).length; }
let toastTm = 0;
function toast(t, cls) { const e = $('toast'); e.textContent = t; e.className = 'show ' + (cls || ''); clearTimeout(toastTm); toastTm = setTimeout(() => e.className = '', 1400); }

/* ---------------- Kontroller ---------------- */
function steer(d) { if (mode !== 'race' && mode !== 'count') return; S.lane = clamp(S.lane + d, 0, 2); }
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { steer(-1); e.preventDefault(); }
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { steer(1); e.preventDefault(); }
  if ((e.key === 'p' || e.key === 'P' || e.key === 'Escape') && (mode === 'race' || mode === 'pause')) togglePause();
});
function bindBtn(id, d) {
  const b = $(id);
  b.addEventListener('pointerdown', e => { e.preventDefault(); b.classList.add('down'); steer(d); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => b.classList.remove('down')));
}
bindBtn('btnL', -1); bindBtn('btnR', 1);
cv.addEventListener('pointerdown', e => { const r = cv.getBoundingClientRect(); steer(e.clientX - r.left < r.width / 2 ? -1 : 1); });
$('soundBtn').onclick = () => { cfg.sound = !cfg.sound; $('soundBtn').textContent = cfg.sound ? '🔊' : '🔇'; if (cfg.sound) sfx('beep'); };
$('pauseBtn').onclick = () => { if (mode === 'race' || mode === 'pause') togglePause(); };
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'race') togglePause(); });

/* ---------------- Güncelleme ---------------- */
function update(dt) {
  S.t += dt;
  const v = curV();
  S.dist += v * dt;
  const pz = S.dist + ZP;

  // mesafe puanı
  S.distAcc += v * dt; while (S.distAcc >= 30) { S.distAcc -= 30; S.score += 1; }

  // oyuncu şerit değiştirme
  const tx = LANES[S.lane], dx = tx - S.px, step = 7.5 * dt;
  S.px = Math.abs(dx) <= step ? tx : S.px + Math.sign(dx) * step;
  S.lean += ((Math.abs(dx) > .02 ? Math.sign(dx) : 0) - S.lean) * Math.min(1, dt * 10);
  camX += (S.px * 0.55 - camX) * Math.min(1, dt * 6);

  S.crashMul += (1 - S.crashMul) * Math.min(1, dt * 0.9);
  S.boost = Math.max(0, S.boost - dt); S.invuln = Math.max(0, S.invuln - dt); S.shake = Math.max(0, S.shake - dt);

  // rakipler belirli aralıklarla hızlanır
  S.rivalT += dt; if (S.rivalT > 14) { S.rivalT = 0; S.rivalF *= 1.035; }
  updateRivals(dt, pz);
  if (mode !== 'race') return;

  // kapı (cevap şeritleri)
  const g = S.gate;
  if (g && !g.done && g.z <= pz) {
    g.done = true;
    const myLane = [0, 1, 2].reduce((best, l) => Math.abs(LANES[l] - S.px) < Math.abs(LANES[best] - S.px) ? l : best, 0);
    answer(myLane === g.lane);
    if (mode !== 'race') return;
    nextQuestion(false);
  }

  // nesneler
  for (const o of S.objs) {
    const d = o.z - pz;
    if (o.gone || d > 1.2 || d < -1.2) continue;
    if (o.type === 'coin' && Math.abs(o.x - S.px) < .55 && Math.abs(d) < .9) { o.gone = true; S.coins++; S.score += 5; sfx('coin'); burst(o.x, o.z, '#ffd23f', 8); }
    else if (o.type === 'heart' && Math.abs(o.x - S.px) < .55 && Math.abs(d) < .9) {
      o.gone = true; if (S.lives < MAXLIVES) { S.lives++; toast('❤ +1 can', 'good'); } else { S.score += 10; toast('❤ +10 puan', 'good'); }
      sfx('heart'); burst(o.x, o.z, '#ff5d73', 10);
    }
    else if (o.type === 'ob' && !o.hit && Math.abs(d) < .75 && Math.abs(o.x - S.px) < o.w / 2 + .3) { o.hit = true; crash('Engele çarptın!'); if (mode !== 'race') return; }
  }
  S.objs = S.objs.filter(o => !o.gone && o.z > S.dist - 3);

  // parçacıklar
  for (const p of S.parts) { p.life -= dt; p.x += p.vx * dt; p.h += p.vh * dt; p.vh -= 9 * dt; p.z += p.vz * dt; }
  S.parts = S.parts.filter(p => p.life > 0);
  if (S.boost > 0 && Math.random() < .6) S.parts.push({ x: S.px + rf(-.2, .2), z: pz - .45, h: .15, vx: rf(-.3, .3), vh: rf(.2, 1), vz: rf(-3, -1), life: .35, col: Math.random() < .5 ? '#ffb000' : '#ff5a1f', r: .09 });
  hud();
}

function answer(ok) {
  const q = S.q;
  if (ok) {
    S.correct++; S.score += POINTS; sfx('ok');
    $('qtext').textContent = `${q.a} × ${q.b} = ${q.c}`; $('qtext').className = 'ok';
    let msg = 'Doğru! +' + POINTS;
    if (S.correct % 5 === 0) { S.sf *= 1.10; S.boost = 1.6; sfx('boost'); msg = '🔥 TURBO! Hız +%10'; }
    if (S.correct % 10 === 0 && S.lives < MAXLIVES) { S.lives++; msg += ' · ❤ +1 can'; }
    toast(msg, S.correct % 5 === 0 ? 'gold' : 'good');
    S.flash = { col: '#2fb35a', t: .35 };
    if (S.correct >= TARGET) { finish(true); return; }
  } else {
    S.wrong++; S.score = Math.max(0, S.score - POINTS); S.sf = Math.max(0.5, S.sf * 0.9); sfx('no');
    $('qtext').textContent = `${q.a} × ${q.b} = ${q.c}`; $('qtext').className = 'bad';
    toast(`Yanlış! Doğrusu ${q.c} · Hız −%10`, 'bad');
    S.flash = { col: '#e5383b', t: .35 };
  }
}
function crash(msg) {
  if (S.invuln > 0) return;
  S.lives--; S.crashes++; S.crashMul = 0.4; S.invuln = 1.8; S.shake = .35; sfx('crash');
  burst(S.px, S.dist + ZP, '#ffffff', 14);
  toast(msg + ' −1 can', 'bad');

}
function burst(x, z, col, n) {
  for (let i = 0; i < n; i++) S.parts.push({ x, z, h: .4, vx: rf(-1.5, 1.5), vh: rf(1, 4), vz: rf(-1, 3), life: rf(.4, .8), col, r: rf(.05, .1) });
}

function updateRivals(dt, pz) {
  const pv = curV();
  for (const r of S.rivals) {
    let v = r.base * S.rivalF;
    const gap = r.z - pz;
    if (gap > 140) v *= 0.85; else if (gap < -140) v *= 1.2;          // çok açılan rakip yarışa geri döner
    const blockedAt = (lane, z0, z1) =>
      S.objs.some(o => o.type === 'ob' && o.lanes.includes(lane) && o.z > z0 && o.z < z1) ||
      S.rivals.some(o => o !== r && o.lane === lane && o.z > z0 && o.z < z1) ||
      (Math.abs(LANES[lane] - S.px) < .7 && pz > z0 && pz < z1);
    // önündeki engel veya yavaş araçtan kaçın
    const aheadBlocked = blockedAt(r.lane, r.z + 0.3, r.z + 7);
    if (aheadBlocked && Math.abs(r.x - LANES[r.lane]) < .05) {
      const opts = [r.lane - 1, r.lane + 1].filter(l => l >= 0 && l <= 2 && !blockedAt(l, r.z - 2.5, r.z + 8));
      if (opts.length) r.lane = opts[rnd(0, opts.length - 1)];
      else if (Math.abs(LANES[r.lane] - S.px) < .7 && pz > r.z && pz - r.z < 4) v = Math.min(v, pv * 0.95);
    }
    // oyuncunun hemen arkasındaysa ve yol kapalıysa bekle
    if (Math.abs(r.x - S.px) < .7 && pz > r.z && pz - r.z < 2.2) v = Math.min(v, pv * 0.9);
    r.v = v;
    r.z += v * dt;
    const dx = LANES[r.lane] - r.x, st = 4.5 * dt;
    r.x = Math.abs(dx) <= st ? LANES[r.lane] : r.x + Math.sign(dx) * st;
    r.lean += ((Math.abs(dx) > .02 ? Math.sign(dx) : 0) - r.lean) * Math.min(1, dt * 8);
    // rakip engelden kaçamadıysa yavaşlar (çarpma yok sayılır)
    // oyuncu ile çarpışma
    if (Math.abs(r.x - S.px) < .68 && Math.abs(r.z - pz) < 1.05 && S.invuln <= 0) {
      crash('Rakibe çarptın!');
      r.z = pz + 1.6;
      if (mode !== 'race') return;
    }
    // geçme takibi
    const nowAhead = r.z > pz;
    if (r.ahead && !nowAhead) { S.passes++; S.score += 10; sfx('pass'); toast('🏁 Rakibi geçtin! +10', 'gold'); }
    else if (!r.ahead && nowAhead) toast('Bir rakip seni geçti!', '');

}

/* ---------------- Çizim yardımcıları ---------------- */
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

/* Kart (arkadan görünüm). x: merkez, yb: tekerlek altı, w: genişlik(px) */

  ctx.fillStyle = c.body; ctx.fillRect(-w * .13, -h * .86, w * .26, h * .05);

  else { ctx.beginPath(); ctx.ellipse(0, -h * .62, w * .42, h * .06, 0, 0, 7); ctx.fill(); ctx.fillStyle = c.acc; ctx.fillRect(-w * .3, -h * .5, w * .6, h * .04); }

function drawDecor(kind, x, y, u) {

    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(u * .35, -u * 1.3, u * .15, -u * 2.6); ctx.stroke();

    ctx.fillStyle = '#7a4a1e'; ctx.beginPath(); ctx.arc(u * .1, -u * 2.5, u * .1, 0, 7); ctx.arc(u * .25, -u * 2.48, u * .1, 0, 7); ctx.fill();
  } else if (kind === 'bush') {

    rr(-u * .55, -u * 1.15, u * .22, u * .55, u * .11); ctx.fill(); rr(-u * .55, -u * .8, u * .45, u * .2, u * .1); ctx.fill();
    rr(u * .33, -u * 1.4, u * .22, u * .6, u * .11); ctx.fill(); rr(u * .1, -u * 1.0, u * .45, u * .2, u * .1); ctx.fill();

    ctx.fillStyle = '#b07a4f'; ctx.beginPath(); ctx.moveTo(-u * .6, 0); ctx.lineTo(-u * .4, -u * .5); ctx.lineTo(u * .1, -u * .65); ctx.lineTo(u * .55, -u * .3); ctx.lineTo(u * .6, 0); ctx.fill();

    ctx.fillStyle = '#6b4a2b'; ctx.fillRect(-u * .08, -u * .4, u * .16, u * .4);
    for (let i = 0; i < 3; i++) {
      const yy = -u * (.35 + i * .55), ww = u * (.75 - i * .18);
      ctx.fillStyle = '#1f6b45'; ctx.beginPath(); ctx.moveTo(-ww, yy); ctx.lineTo(0, yy - u * .9); ctx.lineTo(ww, yy); ctx.fill();
      if (kind === 'pineS') { ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(-ww * .45, yy - u * .5); ctx.lineTo(0, yy - u * .9); ctx.lineTo(ww * .45, yy - u * .5); ctx.fill(); }
    }

}

  ctx.beginPath(); ctx.arc(0, -u * .4, u * .4, 0, 7); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, -u * 1.0, u * .28, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#1f2433'; ctx.beginPath(); ctx.arc(-u * .1, -u * 1.05, u * .04, 0, 7); ctx.arc(u * .1, -u * 1.05, u * .04, 0, 7); ctx.fill();

function drawObstacle(o, x, y, u) {

    ctx.save(); rr(-hw, top, hw * 2, bh, u * .04); ctx.clip();
    for (let i = -hw; i < hw; i += u * .22) { ctx.fillStyle = (Math.round((i + hw) / (u * .22)) % 2) ? '#e5383b' : '#ffffff'; ctx.beginPath(); ctx.moveTo(i, top + bh); ctx.lineTo(i + u * .11, top); ctx.lineTo(i + u * .22, top); ctx.lineTo(i + u * .11, top + bh); ctx.fill(); }
    ctx.restore();

      ctx.fillStyle = '#1f2433'; ctx.font = `900 ${Math.max(5, u * .16)}px system-ui,Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('YOL KAPALI', 0, top - u * .19);
      ctx.fillStyle = '#ff7a1a'; ctx.beginPath(); ctx.arc(-hw + u * .1, top - u * .04, u * .06, 0, 7); ctx.arc(hw - u * .1, top - u * .04, u * .06, 0, 7); ctx.fill();

    ctx.fillStyle = '#ffd23f'; ctx.font = `900 ${Math.max(5, u * .2)}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('!', 0, -u * .37);
  } else if (k === 'tumble') {

function drawCoin(x, y, u, t) {

  ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.ellipse(x, cy, r * sx * .78, r * .78, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff6c2'; ctx.beginPath(); ctx.ellipse(x - r * sx * .25, cy - r * .3, r * sx * .18, r * .22, 0, 0, 7); ctx.fill();

function drawHeart(x, y, u, t) {

function drawGate(g, dz) {
  const pl = P(-RW - .15, dz), pr = P(RW + .15, dz), u = pl.u;
  const postH = 2.15 * u, beamY = pl.g - postH;
  ctx.fillStyle = '#e9edf3'; ctx.fillRect(pl.x - u * .07, beamY, u * .14, postH); ctx.fillRect(pr.x - u * .07, beamY, u * .14, postH);

    ctx.strokeStyle = '#9aa3b2'; ctx.lineWidth = Math.max(1, u * .03); ctx.beginPath(); ctx.moveTo(p.x - bw * .3, beamY); ctx.lineTo(p.x - bw * .3, by); ctx.moveTo(p.x + bw * .3, beamY); ctx.lineTo(p.x + bw * .3, by); ctx.stroke();
    let fill = '#ffffff', ink = '#1f2433', stroke = '#2d7ff9';
    if (g.done) { if (i === g.lane) { fill = '#d8f5dd'; stroke = '#2fb35a'; } else { fill = '#eceff3'; ink = '#9aa3b2'; stroke = '#c3c9d3'; } }
    rr(bx, by, bw, bh, u * .1); ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = Math.max(1.5, u * .06); ctx.strokeStyle = stroke; ctx.stroke();

    quad(a.x, b.x, a.y, c2.x, d2.x, c2.y, g.done && i === g.lane ? '#2fb35a' : '#ffffffcc');

function drawBackground(tr) {
  const g = ctx.createLinearGradient(0, 0, 0, yH); g.addColorStop(0, tr.sky[0]); g.addColorStop(1, tr.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, yH + 2);
  const off = -camX * W * .04, t = S ? S.t : performance.now() / 1000;
  // bulutlar
  ctx.fillStyle = tr.bg === 'mesa' ? '#fff3e2' : '#ffffff';
  for (let i = 0; i < 4; i++) {
    const x = ((i * 0.31 + t * 0.006 * (i + 1)) % 1.3 - .15) * W + off, y = yH * (0.18 + (i % 3) * 0.14), s = Math.min(W, H) * .05;
    ctx.globalAlpha = .85; ctx.beginPath(); ctx.arc(x, y, s, 0, 7); ctx.arc(x + s, y - s * .4, s * 1.2, 0, 7); ctx.arc(x + s * 2.1, y, s * .9, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  }
  const base = yH, B = Math.min(W, H);
  if (tr.bg === 'sea') {
    ctx.fillStyle = '#ffe680'; ctx.beginPath(); ctx.arc(W * .82 + off, yH * .32, B * .07, 0, 7); ctx.fill();
    ctx.fillStyle = '#25b5c9'; ctx.fillRect(0, base - yH * .1, W, yH * .1 + 2);
    ctx.fillStyle = '#3aa64f'; ctx.beginPath(); ctx.moveTo(W * .08 + off, base - yH * .08); ctx.quadraticCurveTo(W * .2 + off, base - yH * .55, W * .34 + off, base - yH * .08); ctx.fill();
    ctx.fillStyle = '#d9f4ff'; ctx.fillRect(W * .245 + off, base - yH * .42, B * .008, yH * .3);   // şelale
    ctx.fillStyle = '#2e9e48'; ctx.beginPath(); ctx.moveTo(W * .6 + off, base - yH * .08); ctx.quadraticCurveTo(W * .72 + off, base - yH * .35, W * .85 + off, base - yH * .08); ctx.fill();
    ctx.fillStyle = '#f2df9a'; ctx.fillRect(0, base - yH * .03, W, yH * .03 + 2);
  } else if (tr.bg === 'mesa') {
    ctx.fillStyle = '#fff1b8'; ctx.beginPath(); ctx.arc(W * .2 + off, yH * .35, B * .08, 0, 7); ctx.fill();
    ctx.fillStyle = '#c8653d';
    [[.05, .55, .28], [.4, .38, .2], [.7, .6, .26]].forEach(([x0, hh, ww]) => { const x = W * x0 + off, w = W * ww; ctx.beginPath(); ctx.moveTo(x, base); ctx.lineTo(x + w * .12, base - yH * hh); ctx.lineTo(x + w * .88, base - yH * hh); ctx.lineTo(x + w, base); ctx.fill(); });
    ctx.fillStyle = '#a84f2f'; ctx.fillRect(0, base - yH * .06, W, yH * .06 + 2);

    ctx.fillStyle = '#fffbe0'; ctx.beginPath(); ctx.arc(W * .75 + off, yH * .3, B * .06, 0, 7); ctx.fill();
    [[.0, .7, .4, '#7f97b5'], [.3, .9, .45, '#93abc8'], [.62, .65, .45, '#7f97b5']].forEach(([x0, hh, ww, col]) => {
      const x = W * x0 + off, w = W * ww, top = base - yH * hh;
      ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x, base); ctx.lineTo(x + w / 2, top); ctx.lineTo(x + w, base); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(x + w * .35, top + (base - top) * .3); ctx.lineTo(x + w / 2, top); ctx.lineTo(x + w * .65, top + (base - top) * .3); ctx.lineTo(x + w * .55, top + (base - top) * .25); ctx.lineTo(x + w * .45, top + (base - top) * .33); ctx.fill();

}

function drawRoad(tr, dist) {
  ctx.fillStyle = tr.g1; ctx.fillRect(0, yH, W, H - yH);
  const first = Math.floor((dist + 1.0) / SEG), n = Math.ceil(ZFAR / SEG) + 1;
  for (let i = n; i >= 0; i--) {
    const idx = first + i, zw = idx * SEG;
    let d1 = zw - dist, d2 = d1 + SEG;
    if (d2 <= 1.0) continue; d1 = Math.max(d1, 1.0); if (d1 > ZFAR) continue;
    const a = P(0, d1), b = P(0, d2), even = (idx & 1) === 0;
    ctx.fillStyle = even ? tr.g1 : tr.g2; ctx.fillRect(0, b.y, W, a.y - b.y + 1);
    const X = (x, p) => cx + (x - camX) * p.u;
    quad(X(-RW - .28, a), X(RW + .28, a), a.y, X(-RW - .28, b), X(RW + .28, b), b.y, even ? tr.kerbA : tr.kerbB);
    quad(X(-RW, a), X(RW, a), a.y, X(-RW, b), X(RW, b), b.y, even ? tr.road : tr.road2);
    if (even) [-.55, .55].forEach(lx => quad(X(lx - .04, a), X(lx + .04, a), a.y, X(lx - .04, b), X(lx + .04, b), b.y, tr.line));

  ctx.fillStyle = fog; ctx.fillRect(0, yH, W, (H - yH) * .12);
}

function render() {
  const tr = S ? S.tr : TRACKS[cfg.track];
  const dist = S ? S.dist : 0, t = S ? S.t : performance.now() / 1000;
  ctx.save();
  if (S && S.shake > 0) ctx.translate(rf(-6, 6) * S.shake * 3, rf(-4, 4) * S.shake * 3);
  drawBackground(tr);
  drawRoad(tr, dist);

  const list = [];
  // kenar süsleri
  const DS = 6.5, k0 = Math.floor((dist + 1.5) / DS), k1 = Math.floor((dist + ZFAR) / DS);
  for (let k = k0; k <= k1; k++) for (const side of [-1, 1]) {
    const h1 = hash(k * 2 + (side > 0 ? 1 : 0) + cfg.track * 1000);
    if (h1 < .25) continue;
    const kind = tr.decor[Math.floor(hash(k * 7 + side * 3) * tr.decor.length)];
    const x = side * (RW + .9 + hash(k * 13 + side) * 2.2), z = k * DS + hash(k + side * 5) * 2;
    if (z - dist < 1.1) continue;
    list.push({ dz: z - dist, draw: (dz) => { const p = P(x, dz); drawDecor(kind, p.x, p.g, p.u); } });
  }
  if (S) {
    for (const o of S.objs) {
      const dz = o.z - dist; if (dz < 1.1 || dz > ZFAR) continue;
      list.push({ dz, draw: (dz) => { const p = P(o.x, dz); if (o.type === 'coin') drawCoin(p.x, p.g, p.u, t + o.z); else if (o.type === 'heart') drawHeart(p.x, p.g, p.u, t); else drawObstacle(o, p.x, p.g, p.u); } });
    }
    for (const r of S.rivals) {
      const dz = r.z - dist; if (dz < 1.3 || dz > ZFAR) continue;
      list.push({ dz, draw: (dz) => { const p = P(r.x, dz); drawKart(p.x, p.g, p.u * .78, r.c, r.lean, false); } });
    }
    if (S.gate) { const dz = S.gate.z - dist; if (dz > 1.1 && dz < ZFAR + 20) list.push({ dz, draw: (dz) => drawGate(S.gate, dz) }); }
    for (const p of S.parts) { const dz = p.z - dist; if (dz > 1.1) list.push({ dz, draw: (dz) => { const q = P(p.x, dz, p.h); ctx.globalAlpha = clamp(p.life * 2.5, 0, 1); ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(q.x, q.y, Math.max(1, p.r * q.u), 0, 7); ctx.fill(); ctx.globalAlpha = 1; } }); }
    list.push({ dz: ZP, draw: () => { const p = P(S.px, ZP); drawKart(p.x, p.g, p.u * .78, CARS[cfg.car], S.lean, S.invuln > 0 && Math.floor(S.t * 12) % 2 === 0); } });
  }
  list.sort((a, b) => b.dz - a.dz).forEach(e => e.draw(e.dz));

  // turbo hız çizgileri
  if (S && S.boost > 0) {
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2;
    for (let i = 0; i < 14; i++) { const a = rf(0, Math.PI * 2), r1 = rf(.35, .5) * Math.max(W, H), r2 = r1 + rf(40, 90); ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r1, yH + Math.sin(a) * r1 * .7); ctx.lineTo(cx + Math.cos(a) * r2, yH + Math.sin(a) * r2 * .7); ctx.stroke(); }
  }
  // kar yağışı
  if (tr.snow && S) {
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    for (const f of S.snow) { f.y += .004 * f.s * (1 + curV() / 30); f.x += Math.sin(t + f.s * 9) * .0008; if (f.y > 1) { f.y = 0; f.x = Math.random(); } ctx.beginPath(); ctx.arc(f.x * W, f.y * H, f.s * 1.6, 0, 7); ctx.fill(); }
  }
  // doğru / yanlış ışığı
  if (S && S.flash && S.flash.t > 0) { ctx.globalAlpha = S.flash.t * .9; ctx.fillStyle = S.flash.col; ctx.fillRect(0, 0, W, 10); ctx.fillRect(0, H - 10, W, 10); ctx.fillRect(0, 0, 10, H); ctx.fillRect(W - 10, 0, 10, H); ctx.globalAlpha = 1; }
  ctx.restore();

  // şerit ipuçlarında oyuncunun bulunduğu şerit
  if (S) { const me = [0, 1, 2].reduce((b, l) => Math.abs(LANES[l] - S.px) < Math.abs(LANES[b] - S.px) ? l : b, 0); [...$('chips').children].forEach((c, i) => c.classList.toggle('me', i === me)); }
}

/* ---------------- Döngü ---------------- */
let last = 0;
function loop(ts) {
  requestAnimationFrame(loop);   // bir karede hata olsa bile oyun durmasın
  const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts;
  if (mode === 'race') update(dt);
  else if (mode === 'count' && S) { S.t += dt; }
  if (S && S.flash) S.flash.t -= dt;
  render();
  try { engineUpdate(dt); } catch (e) {}
}

    const g = b.dataset.g; $('dialog').querySelectorAll(`.opt[data-g="${g}"]`).forEach(x => x.classList.remove('active')); b.classList.add('active');
    cfg[g] = g === 'diff' ? b.dataset.v : +b.dataset.v;
    if (g === 'obst') $('obstLvGrp').style.display = cfg.obst ? 'block' : 'none';
  });
  $('spd').oninput = e => { cfg.speed = +e.target.value; $('spdV').textContent = '%' + cfg.speed; };
  $('dialog').querySelectorAll('canvas[data-car]').forEach(c => {
    const r = c.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2); c.width = r.width * d; c.height = r.height * d;
    const x = c.getContext('2d'); x.scale(d, d);
    withCtx(x, () => drawKart(r.width / 2, r.height - 4, Math.min(r.width * .6, r.height * 1.2), CARS[+c.dataset.car], 0, false));
  });
  // Ad oyunun başında seçilir; seçilmemişse önce ad penceresi açılır, sonra yarış başlar
  $('go').onclick = async () => {
    if (skorVar() && !window.Skor.oyuncu()) await window.Skor.adSor(skorBilgi());
    if (mode === 'menu') startRace();
  };
  if ($('recBtn')) $('recBtn').onclick = rekorlar;
  if ($('adBtn')) $('adBtn').onclick = async () => {
    await (window.Skor.oyuncu() ? window.Skor.adDegistir(skorBilgi()) : window.Skor.adSor(skorBilgi()));
    $('oyuncuAd').textContent = oyuncuMetni(); $('adBtn').textContent = window.Skor.oyuncu() ? 'Değiştir' : 'Ad seç';
  };
}
function withCtx(c, fn) { const old = ctx; ctx = c; try { fn(); } finally { ctx = old; } }

function startRace() {
  sfx('beep');
  MulEngine.reset();
  S = newState(); camX = 0;
  $('overlay').style.display = 'none';
  nextQuestion(true);
  hud();
  mode = 'count';
  const el = $('count'); el.style.display = 'flex';
  const steps = ['3', '2', '1', 'BAŞLA!'];
  steps.forEach((s, i) => setTimeout(() => {
    if (mode !== 'count') return;
    el.textContent = s; sfx(i < 3 ? 'beep' : 'go');
    if (i === 3) setTimeout(() => { el.style.display = 'none'; if (mode === 'count') mode = 'race'; }, 600);
  }, i * 750));
}
function togglePause() {
  if (mode === 'race') {
    mode = 'pause';
    $('dialog').innerHTML = `<h1>MOLA</h1><p>Yarış duraklatıldı.</p><button class="primary" id="resume">DEVAM ET ▶</button><button class="secondary" id="toMenu">Ayarlara dön (yarış biter)</button>`;
    $('overlay').style.display = 'flex';
    $('resume').onclick = togglePause; $('toMenu').onclick = menu;
  } else if (mode === 'pause') { $('overlay').style.display = 'none'; mode = 'race'; last = performance.now(); }
}
// Rekor listesi: soru türü + zorluk aynı olanlar kendi aralarında yarışır
const DIFF_AD = { kolay: 'Kolay', orta: 'Orta', zor: 'Zor' };
function skorBilgi() { return { oyun: 'carpma', oyunAd: 'Çarpma Arabası', liste: cfg.type + '-' + cfg.diff, listeAd: cfg.type + ' içinde · ' + DIFF_AD[cfg.diff] }; }
const skorVar = () => !!(window.Skor && window.Skor.kurulu);
function oyuncuMetni() { const o = skorVar() && window.Skor.oyuncu(); return o ? o.e + ' ' + o.ad : 'Ad seçilmedi'; }
function rekorlar() { if (skorVar()) window.Skor.listeGoster(skorBilgi()); }

function finish(won) {
  mode = 'end';
  hud();
  if (won) sfx('win');
  const pos = position(), time = Math.round(S.t), mm = Math.floor(time / 60), ss = String(time % 60).padStart(2, '0');
  const title = won ? (pos === 1 ? '🏆 BİRİNCİ OLDUN!' : '🏁 YARIŞ TAMAMLANDI!') : '💥 YARIŞ BİTTİ';
  const msg = won ? `50 soruyu bitirdin. Bitiş sıran: <b>${pos}/4</b>` : `Canların bitti. ${S.correct} doğru cevaba ulaştın, tekrar dene!`;
  setTimeout(() => {
    $('dialog').innerHTML = `<h1>${title}</h1><p>${msg}</p>
      <div class="res"><div>Puan<b>${S.score}</b></div><div>Doğru<b>${S.correct}</b></div><div>Yanlış<b>${S.wrong}</b></div>
      <div>Altın<b>${S.coins}</b></div><div>Geçilen rakip<b>${S.passes}</b></div><div>Süre<b>${mm}:${ss}</b></div></div>
      <button class="primary" id="again">TEKRAR YARIŞ 🏁</button>${skorVar() ? '<button class="secondary" id="recBtn">🏆 Rekorlar</button>' : ''}<button class="secondary" id="toMenu">Ayarları değiştir</button>`;
    $('overlay').style.display = 'flex';
    $('again').onclick = startRace; $('toMenu').onclick = menu;
    if ($('recBtn')) $('recBtn').onclick = rekorlar;
    // Puanı ortak rekor listesine gönder (ad seçimi ve tablo skor-sistemi.js içinde)
    if (skorVar()) window.Skor.oyunBitti(Object.assign(skorBilgi(), { puan: S.score, detay: `${S.correct} doğru, ${S.wrong} yanlış${won ? '' : ', canlar bitti'}` }));
  }, won ? 900 : 700);
}

// Test kolaylığı: yalnızca okuma amaçlı durum bilgisi
window.__carpma = { get state() { return S; }, get mode() { return mode; }, get engine() { return eng && { gain: eng.g.gain.value, hz: eng.o1.frequency.value }; }, LANES };

resize(); menu(); requestAnimationFrame(loop);
})();
</script>
</body>
